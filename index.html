<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泰语美食词库</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 900px; margin: 0 auto; padding-bottom: 16px; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      min-height: 50px;
      padding: 9px 14px;
      border-bottom: 1px solid #eee;
    }
    .thai {
      appearance: none;
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }
    .thai-variants { display: grid; gap: 2px; }
    .thai-variant { display: block; word-break: break-word; }
    .chinese { color: #444; word-break: break-word; }
    .analysis {
      position: fixed;
      inset: auto 0 0 0;
      max-height: 45vh;
      overflow: auto;
      border: 0;
      background: #101515;
      color: #fff;
      padding: 14px 18px 18px;
      box-shadow: 0 -8px 24px rgb(0 0 0 / 18%);
      z-index: 10;
    }
    .analysis[hidden] { display: none; }
    .analysis-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }
    .analysis-title { margin: 0; font-size: 16px; font-weight: 600; }
    .analysis-close {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 4px;
      background: #263131;
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .analysis-body { margin: 0; white-space: pre-wrap; font-size: 15px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 560px) {
      body { font-size: 15px; }
      .row { gap: 9px; padding: 9px 10px; }
      .analysis { padding: 12px 12px 14px; }
    }
  </style>
</head>
<body>
  <main id="list"></main>
  <section id="analysis-panel" class="analysis" hidden aria-live="polite" aria-label="词条解析">
    <div class="analysis-head">
      <h2 id="analysis-title" class="analysis-title">词条解析</h2>
      <button id="analysis-close" class="analysis-close" type="button" aria-label="关闭解析">×</button>
    </div>
    <p id="analysis-body" class="analysis-body"></p>
  </section>
  <p id="copy-status" class="sr-only" aria-live="polite"></p>
  <script>
    const list = document.querySelector("#list");
    const analysisPanel = document.querySelector("#analysis-panel");
    const analysisTitle = document.querySelector("#analysis-title");
    const analysisBody = document.querySelector("#analysis-body");
    const analysisClose = document.querySelector("#analysis-close");
    const copyStatus = document.querySelector("#copy-status");
    let touchTap = { id: null, at: 0 };
    let lastTouchAt = 0;
    let activeThaiButton = null;

    const splitVariants = (value) => {
      const items = Array.isArray(value) ? value : [value];
      const variants = items
        .flatMap((item) => String(item ?? "").split(/\s*(?:=|;|；)\s*/u))
        .map((item) => item.replace(/[\[\]]/gu, "").trim())
        .filter(Boolean);
      return [...new Set(variants)];
    };

    const fallbackCopy = (text) => {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.append(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      return copied;
    };

    const announceCopy = (text) => { copyStatus.textContent = `已复制：${text}`; };

    const copy = (text) => {
      if (navigator.clipboard?.writeText && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(() => announceCopy(text))
          .catch(() => {
            if (fallbackCopy(text)) announceCopy(text);
            else copyStatus.textContent = "复制失败";
          });
      } else if (fallbackCopy(text)) {
        announceCopy(text);
      } else {
        copyStatus.textContent = "复制失败";
      }
    };

    const speak = (text) => {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "th-TH";
      const voice = window.speechSynthesis.getVoices().find((item) => item.lang.toLowerCase().startsWith("th"));
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    };

    const speakAndCopy = (word) => {
      copy(word.spokenThai);
      speak(word.spokenThai);
    };

    const showAnalysis = (word, button) => {
      if (activeThaiButton) activeThaiButton.setAttribute("aria-expanded", "false");
      activeThaiButton = button;
      activeThaiButton?.setAttribute("aria-expanded", "true");
      analysisTitle.textContent = word.spokenThai;
      analysisBody.textContent = word.analysis || `中文释义：${word.chinese}；朗读采用：${word.spokenThai}。`;
      analysisPanel.hidden = false;
      analysisPanel.scrollTop = 0;
    };

    const closeAnalysis = () => {
      analysisPanel.hidden = true;
      activeThaiButton?.setAttribute("aria-expanded", "false");
      activeThaiButton = null;
    };

    const handleTouchPointerUp = (event, word, button) => {
      if (event.pointerType !== "touch") return;
      const now = Date.now();
      const isDoubleTap = touchTap.id === word.id && now - touchTap.at < 420;
      lastTouchAt = now;
      if (isDoubleTap) {
        touchTap = { id: null, at: 0 };
        showAnalysis(word, button);
        return;
      }
      touchTap = { id: word.id, at: now };
      speakAndCopy(word);
    };

    const handleClick = (event, word) => {
      if (Date.now() - lastTouchAt < 700) return;
      if (event.detail === 0 || event.detail === 1) speakAndCopy(word);
    };

    const handleDoubleClick = (event, word, button) => {
      if (Date.now() - lastTouchAt < 700) return;
      event.preventDefault();
      showAnalysis(word, button);
    };

    analysisClose.addEventListener("click", closeAnalysis);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeAnalysis();
    });

    Promise.all([fetch("words.json"), fetch("parsed-words.json")])
      .then(async ([wordsResponse, parsedResponse]) => {
        if (!wordsResponse.ok || !parsedResponse.ok) throw new Error("词库加载失败");
        return [await wordsResponse.json(), await parsedResponse.json()];
      })
      .then(([words, parsed]) => {
        const parsedById = new Map(parsed.map((item) => [item.id, item]));
        const fragment = document.createDocumentFragment();
        for (const sourceWord of words) {
          const offline = parsedById.get(sourceWord.id) || {};
          const parsedVariants = splitVariants(offline.variants?.length ? offline.variants : sourceWord.thai);
          const variants = parsedVariants.length ? parsedVariants : splitVariants(sourceWord.thai);
          const word = {
            ...sourceWord,
            variants,
            spokenThai: variants[0],
            analysis: offline.analysis || `中文释义：${sourceWord.chinese}；朗读采用：${variants[0]}。`,
          };
          const row = document.createElement("div");
          row.className = "row";

          const thai = document.createElement("button");
          thai.className = "thai";
          thai.type = "button";
          thai.setAttribute("aria-controls", "analysis-panel");
          thai.setAttribute("aria-expanded", "false");
          const thaiVariants = document.createElement("span");
          thaiVariants.className = "thai-variants";
          for (const variant of word.variants) {
            const line = document.createElement("span");
            line.className = "thai-variant";
            line.textContent = variant;
            thaiVariants.append(line);
          }
          thai.append(thaiVariants);
          thai.addEventListener("pointerup", (event) => handleTouchPointerUp(event, word, thai));
          thai.addEventListener("click", (event) => handleClick(event, word));
          thai.addEventListener("dblclick", (event) => handleDoubleClick(event, word, thai));

          const chinese = document.createElement("span");
          chinese.className = "chinese";
          chinese.textContent = word.chinese;
          row.append(thai, chinese);
          fragment.append(row);
        }
        list.append(fragment);
      })
      .catch(() => {
        list.textContent = "词库加载失败，请刷新页面。";
      });
  </script>
</body>
</html>
