<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泰语美食词库</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 900px; margin: 0 auto; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 32px;
      gap: 16px;
      align-items: center;
      min-height: 50px;
      padding: 9px 14px;
      border-bottom: 1px solid #eee;
    }
    .thai, .speak {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
      cursor: pointer;
    }
    .thai { text-align: left; word-break: break-word; }
    .chinese { color: #444; word-break: break-word; }
    .speak { font-size: 15px; text-align: center; }
    @media (max-width: 560px) {
      body { font-size: 15px; }
      .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 28px; gap: 9px; padding: 9px 10px; }
    }
  </style>
</head>
<body>
  <main id="list"></main>
  <script>
    const speak = (text) => {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "th-TH";
      const voice = window.speechSynthesis.getVoices().find((item) => item.lang.toLowerCase().startsWith("th"));
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    };

    fetch("words.json")
      .then((response) => response.json())
      .then((words) => {
        const fragment = document.createDocumentFragment();
        for (const word of words) {
          const row = document.createElement("div");
          row.className = "row";

          const thai = document.createElement("button");
          thai.className = "thai";
          thai.type = "button";
          thai.textContent = word.thai;
          thai.setAttribute("aria-label", `朗读 ${word.thai}`);
          thai.addEventListener("click", () => speak(word.thai));

          const chinese = document.createElement("span");
          chinese.className = "chinese";
          chinese.textContent = word.chinese;

          const audio = document.createElement("button");
          audio.className = "speak";
          audio.type = "button";
          audio.textContent = "🔊";
          audio.setAttribute("aria-label", `朗读 ${word.thai}`);
          audio.addEventListener("click", () => speak(word.thai));

          row.append(thai, chinese, audio);
          fragment.append(row);
        }
        document.querySelector("#list").append(fragment);
      });
  </script>
</body>
</html>
